<script>

function myExampleFunction(){
  let myIn01 = parseInt(document.getElementById('myText01').value)
  let mySum = myIn01 + myIn01
  let myReply = myIn01 + ' + ' + myIn01 + ' = ' + mySum
  return myReply
}
function subtract(){
  let myIn01 = parseInt(document.getElementById('myNum01').value)
  let mySum = myIn01 - myIn01
  let myReply = myIn01 + ' - ' + myIn01 + ' = ' + mySum
  return myReply
}
function fill(){
  let myIn01 = parseInt(document.getElementById('myNum01').value)
  return myIn01
}
</script>

functions are used to sensibly organize code. Then they are "Called" elsewhere.

<h4> Example working code</h4>
<input type = text id="myText01" value="3"><br>

<input type=button value="function Example" onClick="{
  document.getElementById('myDiv01').innerHTML = myExampleFunction()
  }"><br>

<input id = myNum01 type=number value="4"><br>
<input type=button value="function Example" onClick="{
  
  if(document.getElementById('myNum01').value <= 6){
    document.getElementById('myDiv01').innerHTML = fill()
    document.getElementById('myDiv02').innerHTML = fill()
    document.getElementById('myDiv03').innerHTML = fill()
    document.getElementById('myDiv04').innerHTML = fill()
    document.getElementById('myDiv05').innerHTML = fill()
    document.getElementById('myDiv06').innerHTML = fill()
  }else{
    document.getElementByID('myDiv02').innerHTML = subtract()
  }
    }"><br>
