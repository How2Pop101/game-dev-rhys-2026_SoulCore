
<h2>t2a22-local-storage-rhys.html</h2>

Use local storage to make a to-do list

<body onload="{
   myStorage = localStorage.getItem('myStoredText')
   if(myStorage  != null){
      document.getElementById('myText1').value = myStorage
   }
   myStorage02 = localStorage.getItem('myStoredNum')
   if(myStorage02  != null){
      document.getElementById('num01').value = myStorage02
    }
}">

<body onunload="{
   localstorage.setItem('myStoredText',document.getElementById('myText1').value)
}">   

Text example: <input id="myText1" type=text size=70 value="" placeholder="Write here to store"><br>

<input type="button" value="Store Text" onClick="{
   localStorage.setItem('myStoredText', document.getElementById('myText1').value)
   alert(document.getElementById('myText1').value + ' \nHas been stored')
   document.getElementById('myText1').value = ''
}">

<input type="button" value="Retrieve Text" onClick="{
   document.getElementById('myText1').value = localStorage.getItem('myStoredText')
}"> 

<input type=number value="2763" id='num01'>
   
<input type="button" value="Store Number" onClick="{
   localStorage.setItem('myStoredNum', document.getElementById('num01').value)
   alert(document.getElementById('num01').value + ' \nHas been stored')
   document.getElementById('num01').value = ''
}">

<input type="button" value="Retrieve Number" onClick="{
   document.getElementById('num01').value = localStorage.getItem('myStoredNum')
}">
