


<body id="myBody" style="background-repeat:repeat; background-size: 10%" background="Images/Backgrounds/BG.png" onload="theWorldRevolving()">

<h1 align=center>t2a18-game-template-fred</h1>
<br><br><br><br>

<script>
function theWorldRevolving(){
   clearInterval(myClock)
   let myTemp = '100px 0px'
   myClock = setInterval(function(){
   myGlobalX -= 1
   let myY = myGlobalX 
   myTemp =  myGlobalX + 'px ' + myY + 'px'
   document.getElementById('myBody').style.backgroundPosition = myTemp
   }, 100)
}
   
   function sound(src) {
  this.sound = document.createElement("audio");
  this.sound.src = src;
  this.sound.setAttribute("preload", "auto");
  this.sound.setAttribute("controls", "none");
  this.sound.style.display = "none";
  document.body.appendChild(this.sound);
  this.play = function(){
    this.sound.play();
  }
  this.stop = function(){
    this.sound.pause();
  }
}
   
   // global variables here
   let myGlobalX = 0
   let myClock
   let hit = new sound('audio/hit.mp3')
   let gameOver = false
   let speed = 10
   let speedB = -10
   
   // global functions here
function myHitOther(my1,my2){
   left1   = parseInt(document.getElementById(my1).style.left)
   right1  = left1 + parseInt(document.getElementById(my1).style.width)
   top1    = parseInt(document.getElementById(my1).style.top)   
   bottom1 = top1   + parseInt(document.getElementById(my1).style.height)
   left2   = parseInt(document.getElementById(my2).style.left)
   right2  = left2 + parseInt(document.getElementById(my2).style.width)
   top2    = parseInt(document.getElementById(my2).style.top)   
   bottom2 = top2   + parseInt(document.getElementById(my2).style.height)
   if ((right1  >=  left2  ) &&      	   
       (bottom1 >=  top2   ) &&
       (left1   <=  right2 ) &&
       (top1    <=  bottom2) ){
       return true
   }
}

window.addEventListener('keydown', function (e) {
   window.keys = (window.keys || []);
    window.keys[e.keyCode] = true;
})
window.addEventListener('keyup', function (e) {
   window.keys[e.keyCode] = false;
})

function updateGameArea() {
   if (window.keys && window.keys[37]) {
         if(gameOver==false){
      document.getElementById('myImg01').style.left = parseInt(document.getElementById('myImg01').style.left) + speedB + 'px';
      document.getElementById('hitbox01').style.left = parseInt(document.getElementById('hitbox01').style.left) + speedB + 'px';
      myCheckHit();
      console.log('left')
         }
   }
   if (window.keys && window.keys[39]) {
         if(gameOver==false){
      document.getElementById('myImg01').style.left = parseInt(document.getElementById('myImg01').style.left) + speedB + 'px';
      document.getElementById('hitbox01').style.left = parseInt(document.getElementById('hitbox01').style.left) + speedB + 'px';
      myCheckHit();
      console.log('right')
         }
   }
   if (window.keys && window.keys[38]) {
         if(gameOver==false){
      document.getElementById('myImg01').style.top = parseInt(document.getElementById('myImg01').style.top) + speedB + 'px';
      document.getElementById('hitbox01').style.top = parseInt(document.getElementById('hitbox01').style.top) + speedB + 'px';
      myCheckHit();
      console.log('up')
         }  
   }
   if (window.keys && window.keys[40]) {   
      if(gameOver==false){
         document.getElementById('myImg01').style.top = parseInt(document.getElementById('myImg01').style.top) + speed + 'px'
         document.getElementById('hitbox01').style.top = parseInt(document.getElementById('hitbox01').style.top) + speed + 'px'
         myCheckHit();
         console.log('down')
      }
   }
}
   
function loss(){
   alert('Tee hee, looks like i got ya!')
   location = 'index.html'
   gameOver = false
}

function myCheckHit(){
   if ( myHitOther('hitbox01','hitbox02') ){
      hit.play()
      setTimeout(loss, 3600)
      gameOver = true
         // go to your next level
   }


   // more if statements here like the above



}  // end of myCheckHit()


</script>
