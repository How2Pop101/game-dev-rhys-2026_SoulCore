<script>

  //using a script tage to make the class global
  class myAnimal{
    constructor(passName, passAge) {
      this.myName = passName;
      this.myAge = passAge;
    }
    myShow(){
      document.getElementById('myDiv01').innerHTML = 'Hello, ' + this.myName+'.<br>'
    }
  } //end class myAnimal
</script>

<h2 align=center>t1a14-extend-class-rhys.html</h2>
Extending a pre-exiting class<br>

<h4>example working classes code</h4>
Name: <input type=text id="myText01" value="Snickers">
Age: <input type=number id="myNum01" value="5">
<input type=button value="Does this one like you?" onClick="{
  let name = document.getElementById('myText01').value
  let age = document.getElementById('myNum01').value
  class myCat extends myAnimal {

    myShow(){
      document.getElementById('myDiv01').innerHTML = this.myName + ' likes you! they are' + this.myAge + ' years old!<br>'
    }
  } //end extended class myCat


  let myPet = new myCat(name, age)
  myPet.myShow()
}"><br><br>
