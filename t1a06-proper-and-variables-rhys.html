<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>t1a06-proper-and-variables-rhys.html</title>
  <style>
    b { color: blue; }
  </style>
  <script>
    function sayHello() {
      myNum= 3;
      myString = ' Hello ';
      myFloat = 17.5;
      myBool = true;
      myOut = document.getElementById('myDiv01');
      myOut.innerHTML = myNum + myString + myFloat + ', ' + myBool;
      if (myBool) {myOut.innerHTML += ', WOW';}
    }
  </script>
</head>
<body>
  <p>This is <b>bold</b> text</p>
  <input id='num' type=number value = '3'>
  <input id='string' type=string value = ' Hello '>
  <input id='float' type=float value = '17.5'>
  <input id ='bool' type=boolean value=true>
  <button onclick="sayHello()">Click Me</button>
  <div id='myDiv01'>...</div>
</body>
</html>
