<h2 align=center>t1a05-input-output-rhys</h2>

<a href="https://www.w3schools.com/jsref/prop_html_innerhtml.asp">Good reference to input output 
  Javascript innerHTML value by rhys</a>

  <h4>Example input/output vode</h4>
  <pre>
    
    myIn01= document.getElementById('myNum01').value
    document.getElementById('myDiv01').innerHTML = "hi"
    
  </pre>

  <h4>Example working code</h4>

  <input id="myNum01" type=number value="1"><br>
  <input id="myNum02" type=number value="2"><br>

  <input type=button value=In01^2" onClick="{
    let myIn01 = parseFloat(document.getElementById('myNum01').value)
    let myAnswer = myIn01 * myIn01
    document.getElementById('myDiv01').innerHTML = myIn01 + ' squared = ' + myAnswer
  }"><br>

 <input type=button value="In02^2" onClick="{
    let myIn01 = parseFloat(document.getElementById('myNum01').value)
    let myAnswer = myIn02 * myIn02
    document.getElementById('myDiv01').innerHTML = myIn02 + ' squared = ' + myAnswer
  }"><br>

  <input type=button value="+" onClick="{
    let myIn01 = parseFloat(document.getElementById('myNum01').value)
    let myAnswer = myIn01 + myIn02
    document.getElementById('myDiv01').innerHTML = myIn01 + ' + ' + myIn02 ' = ' myAnswer
  }">
  <input type=button value="-" onClick="{
    let myIn01 = parseFloat(document.getElementById('myNum01').value)
    let myAnswer = myIn01 - myIn02
    document.getElementById('myDiv01').innerHTML = myIn01 + ' - ' + myIn02 ' = ' myAnswer
  }"><br>
  <input type=button value="Try to guess!" onClick="{
    let myIn01 = parseFloat(document.getElementById('myNum01').value)
    let myAnswer = myIn01 + myIn02 + myIn02 - myIn01
    document.getElementById('myDiv01').innerHTML ='??? = ' + myAnswer
  }"><br><br>
  <input type=button value="Blue" onClick="{
    document.getElementById('myDiv01').style.color = 'Blue'
  }"><br>
  <input type=button value="Green" onClick="{
    document.getElementById('myDiv01').style.color = 'Green'
  }"><br>
  <input type=button value="Red" onClick="{
    document.getElementById('myDiv01').style.color = 'Red'
  }"><br>


  <div id="myDiv01">...</div>
