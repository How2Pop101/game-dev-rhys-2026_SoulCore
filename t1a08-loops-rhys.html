<h4> Example Working code</h4>

Max loops: <input id="myNum01" type=number value="4"><br>
weird number: <input id="myWeird" type=number value="4"<br>

<input type=button value="basic For loop with descisions" onclick="{
  document.getElementById('myDiv01').innerHTML = ''
  let myTemp = ''
  let myMax = parseInt(document.getElementById('myNum01').value)
  let myMin = parseInt(document.getElementById('myWeird').value)

  for (let myLoop = myMin; myLoop < myMax; myLoop++ ){
    if (myLoop * 2 > myMax){
      myTemp += ' cool '
    }
  myTemp += 'Loop number: ' + myLoop + '<br>'
  }
  document.getElementById('myDiv01').innerHTML = myTemp
}">

<input type=button value="even number identifier" onclick ="{
  document.getElementById('myDiv01').innerHTML = ''
  let myTemp = ''
  let myMin = parseInt(document.getElementById('myWeird').value)
  let myMax = parseInt(document.getElementById('myNum01').value)

  for (let myLoop = myMin; myLoop < myMax; myLoop++){
    if (myLoop % 2 == 0){
      myTemp += ' is an even number.'
    }else{
      myTemp += ' is an odd number.'
    }
    myTemp += 'Loop number: ' + myLoop + '<br>'
  }
  document.getElementById('myDiv01').innerHTML = myTemp
}"><br><br>
factorable number: <input id="myNum02" type=number value="4"><br>
<input type=button value="factor identifier" onclick ="{
  document.getElementById('myDiv01').innerHTML = ''
  let myTemp = ''
  let myNum = parseInt(document.getElementById('myNum02').value)

  for (let myLoop = 1; myLoop <= myNum; myLoop++){
    if (myNum % myLoop == 0){
      myTemp += myLoop += ', '
    }
  }
  document.getElementById('myDiv01').innerHTML = myTemp
}">
