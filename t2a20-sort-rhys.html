<h1 align=center>t2a20-sort-rhys.html</h1>

<script>
  let myMax = 52 //52 when working
  let myCards = new Array
</script>

<input type=button value="Set Random" onclick="{
  for(let myLoop=0; myLoop < myMax; myLoop++){
    myCards[myLoop]=Math.floor((Math.random()*10)+1)
  }
}">
<br>
<input type=button value="Show" onclick="{
  let myTemp=''
  for(let myLoop=0; myLoop < myMax; myLoop++){
    myTemp += myLoop + ' = '+ myCards[myLoop] + '<br>'
  }
  document.getElementById('myDiv01').innerHTML = myTemp
}">

<input type=button value="Sort" onclick="{
  let myTemp=''
  for(let myLoop=0; myLoop < 10; myLoop++){
    for(let loopTwo=1; loopTwo <= myMax; loopTwo++){
      if(myCards[loopTwo] == myLoop){
        myTemp += loopTwo + ' = '+ myCards[loopTwo] + '<br>'
      }
    }
    myTemp += '<br>'
  }
  document.getElementById('myDiv01').innerHTML = myTemp
}">
<br>
<input type=button value="Quantity" onclick="{
  let myTemp=0
  let one=0
  let two=0
  let three=0
  let four=0
  let five=0
  let six=0
  let seven=0
  let eight=0
  let nine=0
  let ten=0
  
  for(let myLoop=0; myLoop < myMax; myLoop++){
    if (myCards[myLoop] == 1){
      one += 1
    }
    if (myCards[myLoop] == 2){
      two += 1
    }
    if (myCards[myLoop] == 3){
      three += 1
    }
    if (myCards[myLoop] == 4){
      four += 1
    }
    if (myCards[myLoop] == 5){
      five += 1
    }
    if (myCards[myLoop] == 6){
      six += 1
    }
    if (myCards[myLoop] == 7){
      seven += 1
    }
    if (myCards[myLoop] == 8){
      eight += 1
    }
    if (myCards[myLoop] == 9){
      nine += 1
    }
    if (myCards[myLoop] == 10){
      ten += 1
    }
  }
  document.getElementById('myDiv01').innerHTML = ''
  document.getElementById('myDiv01').innerHTML +='Ones: '+ one +'<br>'
  document.getElementById('myDiv01').innerHTML +='Twos: '+ two +'<br>'
  document.getElementById('myDiv01').innerHTML +='Threes: '+ three +'<br>'
  document.getElementById('myDiv01').innerHTML +='Fours: '+ four +'<br>'
  document.getElementById('myDiv01').innerHTML +='Fives: '+ five +'<br>'
  document.getElementById('myDiv01').innerHTML +='Sixes: '+ six +'<br>'
  document.getElementById('myDiv01').innerHTML +='Sevens: '+ seven +'<br>'
  document.getElementById('myDiv01').innerHTML +='Eights: '+ eight +'<br>'
  document.getElementById('myDiv01').innerHTML +='Nines: '+ nine +'<br>'
  document.getElementById('myDiv01').innerHTML +='Tens: '+ ten +'<br>'
}">
<br><br>
<input type=button value="Pick a Card..." onclick="{
  let myTemp=''
  let cardNo= document.getElementById('myNum01').value
  myTemp += cardNo + ' = '+ myCards[cardNo] + '<br>'
  document.getElementById('myDiv01').innerHTML = myTemp
}">
<input type=number value='9' id='myNum01'
<div id="myDiv01"></div>
